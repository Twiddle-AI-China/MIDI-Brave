name: Atlas Flow desktop

# Builds and tests the self-contained desktop app on macOS and Windows.
#
# The real 85 MB weights live on a cluster this runner cannot reach, so the
# build uses a randomly-initialised model of the same architecture
# (packaging/make_test_model.py). That is enough to exercise everything that is
# actually platform-specific -- torch, PyInstaller, the server, the renderer,
# the websocket, the packaged app -- while proving nothing about how the model
# sounds, which is not a thing CI can judge anyway.
#
# Artifacts are the packaged apps. They run, but they play noise: a release
# build swaps in the trained weights via ATLAS_PACK_MODEL.

on:
  push:
    branches: ["main", "v1", "frontend"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple silicon)
            torch-index: ""
          - os: windows-latest
            label: Windows (x64)
            # The default index would pull a CUDA build on Windows: gigabytes
            # of it, for a laptop app that does not use CUDA.
            torch-index: "--index-url https://download.pytorch.org/whl/cpu"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the inference and packaging dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.torch-index }} torch
          pip install numpy scipy soundfile aiohttp PyYAML pyinstaller

      - name: Build a test model
        shell: bash
        run: python packaging/make_test_model.py --out build/test-model

      - name: Freeze the server
        shell: bash
        env:
          ATLAS_PACK_ROOT: ${{ github.workspace }}
          ATLAS_PACK_MODEL: ${{ github.workspace }}/build/test-model
        run: |
          python -m PyInstaller packaging/atlas-flow-server.spec \
            --noconfirm --distpath build/pyi --workpath build/pyi-work --log-level WARN

      - name: Test the frozen server
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            SERVER=build/pyi/atlas-flow-server/atlas-flow-server.exe
          else
            SERVER=build/pyi/atlas-flow-server/atlas-flow-server
          fi
          python packaging/smoke_test.py --server "$SERVER"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Package the desktop app
        shell: bash
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npm run pack

      - name: Test the packaged app
        shell: bash
        working-directory: electron
        run: node smoke.js

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: AtlasFlow-${{ runner.os }}
          path: electron/dist/AtlasFlow-*
          retention-days: 14
          # Already ~1 GB of mostly-incompressible torch; do not spend the time.
          compression-level: 1

      - name: Upload logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ runner.os }}
          path: |
            build/pyi-work/**/warn*.txt
            build/smoke-cache/**/*.log
          retention-days: 7
          if-no-files-found: ignore
