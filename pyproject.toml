[project]
name = "midibrave"
version = "0.1.0"
description = "Dual-branch MIDI-conditioned BRAVE training framework"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "soundfile==0.12.1",
  "scipy>=1.17,<1.18",
  "PyYAML==6.0.2",
  "tensorboard>=2.21,<2.22",
  "torchcrepe==0.0.24",
  "laion-clap==1.1.7",
  "aiohttp==3.14.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
midibrave = "midibrave.cli:main"
midibrave-train = "midibrave.trainer:main"
midibrave-evaluate = "midibrave.evaluate:main"
midibrave-zrave-prepare = "midibrave.zrave_data:main"
midibrave-zrave-train = "midibrave.zrave_train:main"
midibrave-zrave-evaluate = "midibrave.zrave_evaluate:main"
midibrave-zrave-flow-data = "midibrave.zrave_flow_data:main"
midibrave-zrave-pitch-train = "midibrave.zrave_pitch_train:main"
midibrave-zrave-flow-train = "midibrave.zrave_flow_train:main"
midibrave-zrave-flow-evaluate = "midibrave.zrave_flow_evaluate:main"
midibrave-atlas-manifest = "midibrave.atlas_flow_manifest:main"
midibrave-atlas-train = "midibrave.atlas_flow_train:main"
midibrave-atlas-evaluate = "midibrave.atlas_flow_evaluate:main"
midibrave-atlas-dashboard = "midibrave.atlas_flow_dashboard:main"
midibrave-atlas-runtime = "midibrave.atlas_flow_runtime_server:main"
midibrave-atlas-portal = "midibrave.atlas_flow_portal:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midibrave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
